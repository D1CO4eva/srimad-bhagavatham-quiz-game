services:
  # Postgres removed as part of the Firestore migration — see
  # scripts/firestore-spike/ and `npm run emulators:up` for local Firestore.
  # Not deleted from history: Prisma/Postgres access still exists in the
  # codebase during the phased rewrite (see the migration plan) and prod
  # still runs on Supabase Postgres until Phase 8's cutover, but local dev
  # against a fresh docker-compose Postgres is no longer needed day-to-day.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
